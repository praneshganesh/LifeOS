# Fly.io — sparse Talk traffic (machines auto-stop when idle).
# From repo root:
#   npm run deploy:chat-api
# Secrets (once):
#   fly secrets set OPENAI_API_KEY=sk-... CHAT_API_TOKEN=... --app saavi-chat-pranesh

app = "saavi-chat-pranesh"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  CHAT_API_PORT = "8787"
  OPENAI_MODEL = "gpt-4o-mini"
  CHAT_API_RPM = "30"
  CHAT_API_DAILY_MAX = "200"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
